<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учет займов CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                        accentBlue: '#3b82f6',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-3 space-y-4 pb-10">

    <div class="flex items-center justify-between bg-slate-800/80 p-3 rounded-2xl border border-slate-700/50 backdrop-blur shadow-lg">
        <div class="flex items-center gap-2">
            <div class="w-9 h-9 rounded-xl bg-blue-600/20 text-blue-400 flex items-center justify-center font-bold">
                <i class="fa-solid fa-wallet text-lg"></i>
            </div>
            <div>
                <h1 class="text-sm font-bold leading-tight">МикроЗаймы CRM</h1>
                <p class="text-[10px] text-slate-400">Управление договорами</p>
            </div>
        </div>
        <span class="px-2.5 py-1 text-[11px] font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full">Онлайн</span>
    </div>

    <div class="grid grid-cols-2 gap-2.5">
        <div class="bg-slate-800 p-3.5 rounded-2xl border border-slate-700/60 shadow-md">
            <div class="text-[11px] text-slate-400 font-medium mb-1 flex items-center gap-1.5">
                <i class="fa-solid fa-coins text-amber-400"></i> В обороте
            </div>
            <div class="text-lg font-bold text-white tracking-tight">12 500 <span class="text-xs font-semibold text-slate-400">BYN</span></div>
        </div>
        <div class="bg-slate-800 p-3.5 rounded-2xl border border-slate-700/60 shadow-md">
            <div class="text-[11px] text-slate-400 font-medium mb-1 flex items-center gap-1.5">
                <i class="fa-solid fa-chart-line text-emerald-400"></i> Ожид. прибыль
            </div>
            <div class="text-lg font-bold text-emerald-400 tracking-tight">+1 850 <span class="text-xs font-semibold text-emerald-600">BYN</span></div>
        </div>
        <div class="bg-slate-800 p-3.5 rounded-2xl border border-slate-700/60 shadow-md">
            <div class="text-[11px] text-slate-400 font-medium mb-1 flex items-center gap-1.5">
                <i class="fa-solid fa-clock-rotate-left text-blue-400"></i> Ближайшие возвраты
            </div>
            <div class="text-base font-bold text-blue-400">3 договора</div>
        </div>
        <div class="bg-slate-800 p-3.5 rounded-2xl border border-slate-700/60 shadow-md">
            <div class="text-[11px] text-slate-400 font-medium mb-1 flex items-center gap-1.5">
                <i class="fa-solid fa-gavel text-rose-400"></i> В суде
            </div>
            <div class="text-base font-bold text-slate-400">0,00 <span class="text-xs font-normal">BYN</span></div>
        </div>
    </div>

    <div class="flex gap-2 overflow-x-auto pb-1 text-xs no-scrollbar">
        <button class="px-3.5 py-2 rounded-xl bg-blue-600 text-white font-medium whitespace-nowrap shadow-sm">Все (18)</button>
        <button class="px-3.5 py-2 rounded-xl bg-slate-800 text-slate-300 border border-slate-700 whitespace-nowrap">Активные (15)</button>
        <button class="px-3.5 py-2 rounded-xl bg-slate-800 text-slate-300 border border-slate-700 whitespace-nowrap">Претензии (0)</button>
        <button class="px-3.5 py-2 rounded-xl bg-slate-800 text-slate-300 border border-slate-700 whitespace-nowrap">В суде (3)</button>
    </div>

    <div class="space-y-3">
        <div class="text-xs font-bold uppercase tracking-wider text-slate-400 px-1">Активные договоры</div>
        
        <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700/80 shadow-lg space-y-3">
            <div class="flex justify-between items-start border-b border-slate-700/50 pb-2.5">
                <div>
                    <div class="text-sm font-bold text-white flex items-center gap-2">
                        Договор №104
                        <span class="px-2 py-0.5 text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-md">Активен</span>
                    </div>
                    <div class="text-[11px] text-slate-400 mt-0.5">Выдан: 20.08.2026</div>
                </div>
                <div class="text-right">
                    <div class="text-sm font-bold text-blue-400">500 BYN</div>
                    <div class="text-[10px] text-slate-400">2.4% / день</div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2 text-xs bg-slate-900/50 p-2.5 rounded-xl border border-slate-800">
                <div>
                    <span class="text-slate-400 block text-[10px]">К возврату:</span>
                    <span class="font-bold text-emerald-400">740 BYN</span>
                </div>
                <div>
                    <span class="text-slate-400 block text-[10px]">Срок (дней):</span>
                    <span class="font-semibold text-slate-200">20 дней</span>
                </div>
            </div>

            <div class="flex gap-2 pt-1">
                <button onclick="alert('Досудебная претензия отправлена')" class="flex-1 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 py-2 rounded-xl text-xs font-medium transition">
                    <i class="fa-solid fa-file-contract mr-1"></i> Претензия
                </button>
                <button onclick="alert('Передано в суд')" class="flex-1 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 py-2 rounded-xl text-xs font-medium transition">
                    <i class="fa-solid fa-gavel mr-1"></i> В суд
                </button>
            </div>
        </div>
    </div>

    <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-lg space-y-3">
        <div class="text-sm font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-plus-circle text-blue-400"></i> Новый займ
        </div>
        <form class="space-y-2.5" onsubmit="event.preventDefault(); alert('Договор успешно добавлен!');">
            <input type="text" placeholder="Номер договора" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-xs text-white focus:outline-none focus:border-blue-500" required>
            
            <div class="grid grid-cols-2 gap-2">
                <input type="number" placeholder="Сумма (BYN)" class="bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-xs text-white focus:outline-none focus:border-blue-500" required>
                <input type="number" placeholder="Срок (дней)" value="20" class="bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-xs text-white focus:outline-none focus:border-blue-500">
            </div>

            <div class="grid grid-cols-2 gap-2">
                <input type="text" placeholder="% в день" value="2.4%" class="bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-xs text-white focus:outline-none focus:border-blue-500">
                <input type="text" placeholder="Пеня в день" value="2.77%" class="bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-xs text-white focus:outline-none focus:border-blue-500">
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 active:scale-[0.98] text-white py-2.5 rounded-xl text-xs font-bold shadow-lg shadow-blue-600/30 transition">
                Сохранить договор
            </button>
        </form>
    </div>

    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    </script>
</body>
</html>
